{% load static %}<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Self-Checkout</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{% static 'css/app.css' %}" rel="stylesheet"></head>
<body><div class="login-wrap"><div class="card p-4" style="width:380px">
<div class="text-center mb-3"><span class="stat-card"><span class="icon mx-auto mb-2"><i class="bi bi-cart-check"></i></span></span><h4 class="mb-0">Self-Checkout</h4><div class="text-muted small">Painel administrativo</div></div>
{% if form.errors %}<div class="alert alert-danger py-2 small">Utilizador ou palavra-passe incorrectos.</div>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
<div class="mb-3"><label class="form-label small">Utilizador</label><input name="username" class="form-control" autofocus required></div>
<div class="mb-3"><label class="form-label small">Palavra-passe</label><input type="password" name="password" class="form-control" required></div>
<button class="btn btn-primary w-100">Entrar</button></form></div></div></body></html>
